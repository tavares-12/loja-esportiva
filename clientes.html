<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes | Loja Esportiva</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1><i class="fas fa-users"></i> Clientes</h1>
            <p>Cadastro e gerenciamento de clientes</p>
        </div>
    </header>

    <nav>
        <a href="index.html"><i class="fas fa-home"></i> Início</a>
        <a href="produtos.html"><i class="fas fa-box"></i> Produtos</a>
        <a href="clientes.html" class="active"><i class="fas fa-users"></i> Clientes</a>
        <a href="vendas.html"><i class="fas fa-shopping-cart"></i> Vendas</a>
        <a href="relatorios.html"><i class="fas fa-chart-bar"></i> Relatórios</a>
    </nav>

    <main class="container">
        <div class="card">
            <div class="card-header">
                <h2>Lista de Clientes</h2>
                <button class="btn btn-primary" onclick="abrirModalCliente()">
                    <i class="fas fa-user-plus"></i> Novo Cliente
                </button>
            </div>

            <div class="table-responsive">
                <table id="tabelaClientes">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Email</th>
                            <th>Telefone</th>
                            <th>Cidade</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Cliente -->
    <div id="modalCliente" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalClienteTitle">Novo Cliente</h2>
                <button class="close-btn" onclick="fecharModal('modalCliente')">&times;</button>
            </div>
            <input type="hidden" id="clienteId">
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="nomeCliente" placeholder="Ex: João da Silva" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="emailCliente" placeholder="email@exemplo.com" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Telefone</label>
                    <input type="tel" id="telefoneCliente" placeholder="(11) 99999-9999">
                </div>
                <div class="form-group">
                    <label>Cidade</label>
                    <input type="text" id="cidadeCliente" placeholder="São Paulo">
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-success" onclick="salvarCliente()"><i class="fas fa-save"></i> Salvar</button>
                <button class="btn btn-secondary" onclick="fecharModal('modalCliente')">Cancelar</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 SportMax Loja Esportiva</p>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            carregarDadosIniciais();
            carregarClientes();
        });
    </script>
</body>
</html>

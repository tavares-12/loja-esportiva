<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportMax | Vendas</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<!-- ========== CABEÇALHO (IGUAL EM TODAS AS PÁGINAS) ========== -->
<div class="top-bar">
    <div class="container-fluid">
        <span><i class="fas fa-truck"></i> Frete grátis acima de R$ 299</span>
        <span><i class="fas fa-shield-alt"></i> Compra 100% segura</span>
        <span id="userInfo"></span>
    </div>
</div>
<header class="main-header">
    <div class="header-inner">
        <a href="index.html" class="logo">
            <i class="fas fa-bolt"></i>
            <div><strong>SportMax</strong><small>Loja Esportiva</small></div>
        </a>
        <div class="search-box">
            <input type="text" placeholder="Buscar produtos...">
            <button type="button" onclick="location.href='produtos.html'"><i class="fas fa-search"></i></button>
        </div>
        <div class="header-actions">
            <a href="carrinho.html" class="header-btn cart-btn">
                <i class="fas fa-shopping-bag"></i>
                <span class="cart-count" id="cartCount">0</span>
                <span>Carrinho</span>
            </a>
            <a href="login.html" class="header-btn"><i class="fas fa-sign-out-alt"></i> <span>Sair</span></a>
        </div>
    </div>
</header>
<nav class="main-nav">
    <div class="nav-inner">
        <a href="index.html"><i class="fas fa-home"></i> Início</a>
        <a href="produtos.html"><i class="fas fa-th-large"></i> Produtos</a>
        <a href="carrinho.html"><i class="fas fa-shopping-bag"></i> Carrinho</a>
        <a href="vendas.html" class="active"><i class="fas fa-cash-register"></i> Vendas</a>
        <a href="relatorios.html"><i class="fas fa-chart-line"></i> Relatórios</a>
    </div>
</nav>
<!-- ========== FIM DO CABEÇALHO ========== -->

<main class="container page-content">
    <div class="card">
        <div class="card-header">
            <h2><i class="fas fa-history"></i> Histórico de Vendas</h2>
            <a href="carrinho.html" class="btn btn-success"><i class="fas fa-plus"></i> Nova Venda</a>
        </div>
        <div class="table-responsive">
            <table id="tabelaVendas">
                <thead>
                    <tr><th>ID</th><th>Data</th><th>Cliente</th><th>Itens</th><th>Total</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</main>

<footer class="main-footer"><div class="container"><div class="footer-bottom"><p>&copy; 2026 SportMax</p></div></div></footer>

<script src="script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    atualizarCarrinhoUI();
    if (typeof atualizarHeaderAuth === 'function') atualizarHeaderAuth();
    carregarHistoricoVendas();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios | SportMax</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- CABEÇALHO PADRÃO -->
    <div class="top-bar">
        <div class="container-fluid">
            <span><i class="fas fa-truck"></i> Frete grátis acima de R$ 299</span>
            <span><i class="fas fa-shield-alt"></i> Compra 100% segura</span>
            <span><i class="fas fa-headset"></i> Atendimento 7 dias</span>
        </div>
    </div>

    <header class="main-header">
        <div class="header-inner">
            <a href="index.html" class="logo">
                <i class="fas fa-bolt"></i>
                <div>
                    <strong>SportMax</strong>
                    <small>Loja Esportiva</small>
                </div>
            </a>
            <div class="search-box">
                <input type="text" placeholder="Buscar produtos...">
                <button type="button" onclick="location.href='produtos.html'"><i class="fas fa-search"></i></button>
            </div>
            <div class="header-actions">
                <a href="clientes.html" class="header-btn" title="Área Admin">
                    <i class="fas fa-user-cog"></i>
                    <span>Admin</span>
                </a>
                <a href="carrinho.html" class="header-btn cart-btn">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-count" id="cartCount">0</span>
                    <span>Carrinho</span>
                </a>
            </div>
        </div>
    </header>

    <nav class="main-nav">
        <div class="nav-inner">
            <a href="index.html"><i class="fas fa-home"></i> Início</a>
            <a href="produtos.html"><i class="fas fa-th-large"></i> Produtos</a>
            <a href="carrinho.html"><i class="fas fa-shopping-bag"></i> Carrinho</a>
            <a href="contato.html"><i class="fas fa-envelope"></i> Contato</a>
            <a href="clientes.html"><i class="fas fa-users"></i> Clientes</a>
            <a href="vendas.html"><i class="fas fa-cash-register"></i> Vendas</a>
            <a href="relatorios.html" class="active"><i class="fas fa-chart-line"></i> Relatórios</a>
        </div>
    </nav>
    <!-- FIM CABEÇALHO -->

    <main class="container page-content">
        <div class="dashboard-grid" id="resumoRelatorio"></div>

        <div class="charts-grid">
            <div class="card">
                <h3>Vendas por Categoria</h3>
                <canvas id="chartCategorias" height="240"></canvas>
            </div>
            <div class="card">
                <h3>Top 5 Produtos</h3>
                <canvas id="chartProdutos" height="240"></canvas>
            </div>
        </div>

        <div class="card">
            <h3><i class="fas fa-boxes"></i> Status do Estoque</h3>
            <div class="table-responsive">
                <table id="tabelaEstoque">
                    <thead>
                        <tr><th>Produto</th><th>Categoria</th><th>Estoque</th><th>Status</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container"><div class="footer-bottom"><p>&copy; 2026 SportMax</p></div></div>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            atualizarCarrinhoUI();
            gerarRelatorios();
        });
    </script>
</body>
</html>

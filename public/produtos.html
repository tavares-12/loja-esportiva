<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos | SportMax</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="top-bar">
        <div class="container-fluid">
            <span><i class="fas fa-truck"></i> Frete grátis acima de R$ 299</span>
            <span><i class="fas fa-shield-alt"></i> Compra 100% segura</span>
            <span id="userInfo"></span>
        </div>
    </div>
    <header class="main-header">
        <div class="header-inner">
            <a href="index.html" class="logo"><i class="fas fa-bolt"></i><div><strong>SportMax</strong><small>Loja Esportiva</small></div></a>
            <div class="search-box">
                <input type="text" id="buscaProdutos" placeholder="Buscar produtos..." onkeyup="filtrarProdutos()">
                <button type="button"><i class="fas fa-search"></i></button>
            </div>
            <div class="header-actions">
                <a href="carrinho.html" class="header-btn cart-btn"><i class="fas fa-shopping-bag"></i><span class="cart-count" id="cartCount">0</span><span>Carrinho</span></a>
                <a href="#" class="header-btn" onclick="sair();return false;"><i class="fas fa-sign-out-alt"></i> <span>Sair</span></a>
            </div>
        </div>
    </header>
    <nav class="main-nav">
        <div class="nav-inner">
            <a href="index.html"><i class="fas fa-home"></i> Início</a>
            <a href="produtos.html" class="active"><i class="fas fa-th-large"></i> Produtos</a>
            <a href="carrinho.html"><i class="fas fa-shopping-bag"></i> Carrinho</a>
            <a href="vendas.html" class="admin-only"><i class="fas fa-cash-register"></i> Vendas</a>
            <a href="relatorios.html" class="admin-only"><i class="fas fa-chart-line"></i> Relatórios</a>
        </div>
    </nav>

    <main class="container page-content">
        <div class="page-header">
            <h1 id="tituloPagina">Todos os Produtos</h1>
            <p id="subtituloPagina">Encontre o equipamento perfeito</p>
        </div>
        <div class="catalog-layout">
            <aside class="filters">
                <h3>Filtros</h3>
                <div class="filter-group"><label>Categoria</label>
                    <select id="filtroCategoria" onchange="filtrarProdutos()">
                        <option value="">Todas</option>
                        <option value="Futebol">Futebol</option><option value="Corrida">Corrida</option>
                        <option value="Fitness">Fitness</option><option value="Basquete">Basquete</option>
                        <option value="Tênis">Tênis</option><option value="Natação">Natação</option>
                        <option value="Ciclismo">Ciclismo</option>
                    </select>
                </div>
                <div class="filter-group"><label>Ordenar</label>
                    <select id="ordenarPor" onchange="filtrarProdutos()">
                        <option value="nome">Nome A-Z</option><option value="preco-asc">Menor preço</option>
                        <option value="preco-desc">Maior preço</option><option value="estoque">Mais estoque</option>
                    </select>
                </div>
                <div class="filter-group"><label>Preço máx: <span id="precoMaxLabel">R$ 1000</span></label>
                    <input type="range" id="filtroPreco" min="50" max="1000" value="1000" step="10" oninput="atualizarPrecoLabel();filtrarProdutos()">
                </div>
                <button class="btn btn-outline btn-block" onclick="limparFiltros()">Limpar</button>
                <div class="admin-box admin-only">
                    <h4>Admin</h4>
                    <button class="btn btn-primary btn-block" onclick="abrirModalProduto()"><i class="fas fa-plus"></i> Novo Produto</button>
                </div>
            </aside>
            <div class="catalog-main">
                <div class="products-grid" id="produtosGrid"></div>
                <p class="empty-state" id="emptyState" style="display:none">Nenhum produto encontrado.</p>
            </div>
        </div>
    </main>

    <div id="modalProduto" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h2 id="modalTitle">Novo Produto</h2><button class="close-btn" onclick="fecharModal('modalProduto')">&times;</button></div>
            <input type="hidden" id="produtoId">
            <div class="form-group"><label>Nome</label><input type="text" id="nomeProduto"></div>
            <div class="form-group"><label>Categoria</label>
                <select id="categoriaProduto">
                    <option>Futebol</option><option>Corrida</option><option>Fitness</option><option>Basquete</option>
                    <option>Tênis</option><option>Natação</option><option>Ciclismo</option><option>Outros</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Preço</label><input type="number" id="precoProduto" step="0.01"></div>
                <div class="form-group"><label>Estoque</label><input type="number" id="estoqueProduto"></div>
            </div>
            <div class="form-group"><label>URL Imagem</label><input type="text" id="imagemProduto"></div>
            <div class="modal-actions">
                <button class="btn btn-success" onclick="salvarProduto()">Salvar</button>
                <button class="btn btn-secondary" onclick="fecharModal('modalProduto')">Cancelar</button>
            </div>
        </div>
    </div>

    <footer class="main-footer"><div class="container"><div class="footer-bottom"><p>&copy; 2026 SportMax</p></div></div></footer>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await carregarDadosIniciais();
            atualizarCarrinhoUI();
            atualizarHeaderAuth();
            const cat = new URLSearchParams(location.search).get('cat');
            if (cat) {
                document.getElementById('filtroCategoria').value = cat;
                document.getElementById('tituloPagina').textContent = cat;
            }
            filtrarProdutos();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho | SportMax</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="top-bar">
        <div class="container-fluid">
            <span><i class="fas fa-truck"></i> Frete grátis acima de R$ 299</span>
            <span><i class="fas fa-shield-alt"></i> Compra 100% segura</span>
            <span id="userInfo"></span>
        </div>
    </div>
    <header class="main-header">
        <div class="header-inner">
            <a href="index.html" class="logo"><i class="fas fa-bolt"></i><div><strong>SportMax</strong><small>Loja Esportiva</small></div></a>
            <div class="search-box">
                <input type="text" placeholder="Buscar...">
                <button type="button" onclick="location.href='produtos.html'"><i class="fas fa-search"></i></button>
            </div>
            <div class="header-actions">
                <a href="carrinho.html" class="header-btn cart-btn"><i class="fas fa-shopping-bag"></i><span class="cart-count" id="cartCount">0</span><span>Carrinho</span></a>
                <a href="#" class="header-btn" onclick="sair();return false;"><i class="fas fa-sign-out-alt"></i> <span>Sair</span></a>
            </div>
        </div>
    </header>
    <nav class="main-nav">
        <div class="nav-inner">
            <a href="index.html"><i class="fas fa-home"></i> Início</a>
            <a href="produtos.html"><i class="fas fa-th-large"></i> Produtos</a>
            <a href="carrinho.html" class="active"><i class="fas fa-shopping-bag"></i> Carrinho</a>
            <a href="vendas.html" class="admin-only"><i class="fas fa-cash-register"></i> Vendas</a>
            <a href="relatorios.html" class="admin-only"><i class="fas fa-chart-line"></i> Relatórios</a>
        </div>
    </nav>

    <main class="container page-content">
        <div class="page-header"><h1><i class="fas fa-shopping-bag"></i> Meu Carrinho</h1></div>
        <div class="cart-layout" id="cartLayout">
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-summary">
                <h3>Resumo</h3>
                <div class="summary-row"><span>Subtotal</span><strong id="subtotal">R$ 0,00</strong></div>
                <div class="summary-row"><span>Frete</span><strong id="frete">Grátis</strong></div>
                <div class="summary-row total"><span>Total</span><strong id="totalCarrinho">R$ 0,00</strong></div>
                <div class="form-group" style="margin-top:1.2rem"><label>Cliente</label>
                    <select id="clienteCheckout"><option value="">Selecione...</option></select>
                </div>
                <button class="btn btn-success btn-lg btn-block" onclick="finalizarCompra()"><i class="fas fa-lock"></i> Finalizar</button>
                <a href="produtos.html" class="btn btn-outline btn-block" style="margin-top:0.6rem">Continuar</a>
            </div>
        </div>
        <div class="empty-cart" id="emptyCart" style="display:none">
            <i class="fas fa-shopping-bag"></i><h2>Carrinho vazio</h2>
            <p>Adicione produtos para continuar.</p>
            <a href="produtos.html" class="btn btn-primary btn-lg">Ver Produtos</a>
        </div>
    </main>

    <footer class="main-footer"><div class="container"><div class="footer-bottom"><p>&copy; 2026 SportMax</p></div></div></footer>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await carregarDadosIniciais();
            atualizarCarrinhoUI();
            atualizarHeaderAuth();
            renderCarrinho();
            carregarClientesCheckout();
        });
    </script>
</body>
</html>

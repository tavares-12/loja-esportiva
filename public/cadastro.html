<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | SportMax</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0c4a6e 100%);
            padding: 1.5rem;
        }
        .box {
            background: #fff;
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; font-size: 1.5rem; color: #1e293b; margin-bottom: 0.3rem; }
        .sub { text-align: center; color: #64748b; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.35rem; color: #334155; font-size: 0.9rem; }
        .form-group input {
            width: 100%; padding: 0.75rem 0.9rem;
            border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem;
        }
        .btn {
            width: 100%; padding: 0.85rem; margin-top: 0.5rem;
            border: none; border-radius: 8px;
            background: #0ea5e9; color: #fff;
            font-size: 1rem; font-weight: 600; cursor: pointer;
        }
        .btn:hover { background: #0284c7; }
        .links { text-align: center; margin-top: 1.2rem; font-size: 0.9rem; color: #64748b; }
        .links a { color: #0ea5e9; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <div style="text-align:center;margin-bottom:1rem;"><i class="fas fa-bolt" style="font-size:2rem;color:#0ea5e9;"></i></div>
        <h1>Criar Conta</h1>
        <p class="sub">Cadastre-se para comprar na SportMax</p>

        <div class="form-group"><label>Nome completo</label><input type="text" id="nome" placeholder="Seu nome"></div>
        <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="seu@email.com"></div>
        <div class="form-group"><label>Telefone</label><input type="tel" id="telefone" placeholder="(11) 99999-9999"></div>
        <div class="form-group"><label>Cidade</label><input type="text" id="cidade" placeholder="São Paulo"></div>
        <div class="form-group"><label>Senha</label><input type="password" id="senha" placeholder="Mínimo 4 caracteres"></div>

        <button class="btn" onclick="cadastrar()"><i class="fas fa-user-plus"></i> Cadastrar</button>
        <div class="links">Já tem conta? <a href="login.html">Entrar</a></div>
    </div>

    <script>
        function cadastrar() {
            var nome = document.getElementById('nome').value.trim();
            var email = document.getElementById('email').value.trim();
            var telefone = document.getElementById('telefone').value.trim();
            var cidade = document.getElementById('cidade').value.trim();
            var senha = document.getElementById('senha').value;

            if (!nome || !email) { alert('Nome e email são obrigatórios!'); return; }
            if (senha.length < 4) { alert('Senha com pelo menos 4 caracteres.'); return; }

            localStorage.setItem('sportmax_usuario', JSON.stringify({ nome: nome, email: email, telefone: telefone, cidade: cidade, senha: senha }));

            // Tenta API (opcional)
            fetch('/api/clientes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome: nome, email: email, telefone: telefone, cidade: cidade })
            }).catch(function() {});

            localStorage.setItem('sportmax_sessao', JSON.stringify({
                tipo: 'comprador',
                nome: nome,
                email: email,
                hora: new Date().toISOString()
            }));

            alert('Conta criada! Bem-vindo(a), ' + nome);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>

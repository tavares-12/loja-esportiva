<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | SportMax</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0c4a6e 100%);
            padding: 1.5rem;
        }
        .login-box {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        .login-box h1 {
            text-align: center;
            font-size: 1.5rem;
            color: #1e293b;
            margin-bottom: 0.3rem;
        }
        .login-box .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        .login-links {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.9rem;
            color: #64748b;
        }
        .login-links a { color: #0ea5e9; font-weight: 600; }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-box">
            <div style="text-align:center;margin-bottom:1rem;">
                <i class="fas fa-bolt" style="font-size:2rem;background:linear-gradient(135deg,#0ea5e9,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;"></i>
            </div>
            <h1>Criar Conta</h1>
            <p class="subtitle">Cadastre-se para comprar na SportMax</p>

            <div class="form-group">
                <label>Nome completo</label>
                <input type="text" id="cadNome" placeholder="Seu nome">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="cadEmail" placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label>Telefone</label>
                <input type="tel" id="cadTelefone" placeholder="(11) 99999-9999">
            </div>
            <div class="form-group">
                <label>Cidade</label>
                <input type="text" id="cadCidade" placeholder="São Paulo">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="cadSenha" placeholder="Mínimo 4 caracteres">
            </div>

            <button class="btn btn-primary btn-lg btn-block" onclick="cadastrar()">
                <i class="fas fa-user-plus"></i> Cadastrar
            </button>

            <div class="login-links">
                Já tem conta? <a href="login.html">Entrar</a>
            </div>
        </div>
    </div>

    <script>
        async function cadastrar() {
            const nome = document.getElementById('cadNome').value.trim();
            const email = document.getElementById('cadEmail').value.trim();
            const telefone = document.getElementById('cadTelefone').value.trim();
            const cidade = document.getElementById('cadCidade').value.trim();
            const senha = document.getElementById('cadSenha').value;

            if (!nome || !email) {
                alert('Nome e email são obrigatórios!');
                return;
            }
            if (senha.length < 4) {
                alert('A senha deve ter pelo menos 4 caracteres.');
                return;
            }

            // Salva usuário localmente
            const usuario = { nome, email, telefone, cidade, senha };
            localStorage.setItem('sportmax_usuario', JSON.stringify(usuario));

            // Tenta cadastrar também como cliente na API
            try {
                await fetch('/api/clientes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, telefone, cidade })
                });
            } catch (e) {
                console.warn('API offline, cadastro só local');
            }

            // Já entra como comprador
            localStorage.setItem('sportmax_sessao', JSON.stringify({
                tipo: 'comprador',
                nome,
                email,
                hora: new Date().toISOString()
            }));

            alert('✅ Conta criada com sucesso! Bem-vindo(a), ' + nome + '!');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>

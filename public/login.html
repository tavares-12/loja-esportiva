<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | SportMax</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0c4a6e 100%);
            padding: 1.5rem;
        }
        .box {
            background: #fff;
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        .logo { text-align: center; margin-bottom: 1rem; }
        .logo i { font-size: 2.5rem; color: #0ea5e9; }
        h1 { text-align: center; font-size: 1.6rem; color: #1e293b; margin-bottom: 0.3rem; }
        .sub { text-align: center; color: #64748b; margin-bottom: 1.8rem; font-size: 0.95rem; }
        .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
        .role {
            border: 2px solid #e2e8f0;
            background: #f8fafc;
            border-radius: 12px;
            padding: 1.2rem 0.8rem;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .role:hover, .role.on { border-color: #0ea5e9; background: #e0f2fe; }
        .role i { font-size: 1.8rem; color: #0ea5e9; display: block; margin-bottom: 0.5rem; }
        .role strong { display: block; color: #1e293b; font-size: 0.95rem; }
        .role span { font-size: 0.75rem; color: #64748b; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.35rem; color: #334155; font-size: 0.9rem; }
        .form-group input {
            width: 100%; padding: 0.75rem 0.9rem;
            border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem;
        }
        .form-group input:focus { outline: none; border-color: #0ea5e9; }
        .btn {
            width: 100%; padding: 0.85rem;
            border: none; border-radius: 8px;
            background: #0ea5e9; color: #fff;
            font-size: 1rem; font-weight: 600; cursor: pointer;
        }
        .btn:hover { background: #0284c7; }
        .hidden { display: none !important; }
        .links { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #64748b; }
        .links a { color: #0ea5e9; font-weight: 600; text-decoration: none; }
        .erro {
            background: #fee2e2; color: #991b1b;
            padding: 0.7rem; border-radius: 8px;
            margin-bottom: 1rem; font-size: 0.9rem;
            display: none;
        }
        .erro.show { display: block; }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo"><i class="fas fa-bolt"></i></div>
        <h1>SportMax</h1>
        <p class="sub">Escolha como deseja entrar</p>

        <div class="erro" id="erroMsg"></div>

        <div class="roles">
            <div class="role" id="rComp" onclick="escolher('comprador')">
                <i class="fas fa-shopping-bag"></i>
                <strong>Comprador</strong>
                <span>Comprar produtos</span>
            </div>
            <div class="role" id="rAdmin" onclick="escolher('admin')">
                <i class="fas fa-user-shield"></i>
                <strong>Administrador</strong>
                <span>Área restrita</span>
            </div>
        </div>

        <div id="formAdmin" class="hidden">
            <div class="form-group">
                <label>Senha do Administrador</label>
                <input type="password" id="senha" placeholder="Digite a senha" maxlength="20">
            </div>
            <button class="btn" onclick="entrarAdmin()">
                <i class="fas fa-lock"></i> Entrar como Admin
            </button>
        </div>

        <div id="formComp" class="hidden">
            <button class="btn" onclick="entrarComprador()">
                <i class="fas fa-sign-in-alt"></i> Entrar na Loja
            </button>
        </div>

        <div class="links">
            Novo por aqui? <a href="cadastro.html">Cadastre-se</a>
        </div>
    </div>

    <script>
        // Se já logado, vai direto pra loja
        try {
            var s = JSON.parse(localStorage.getItem('sportmax_sessao') || 'null');
            if (s && s.tipo) {
                window.location.href = 'index.html';
            }
        } catch (e) {}

        function escolher(tipo) {
            document.getElementById('rComp').classList.toggle('on', tipo === 'comprador');
            document.getElementById('rAdmin').classList.toggle('on', tipo === 'admin');
            document.getElementById('formAdmin').classList.toggle('hidden', tipo !== 'admin');
            document.getElementById('formComp').classList.toggle('hidden', tipo !== 'comprador');
            document.getElementById('erroMsg').classList.remove('show');
            if (tipo === 'admin') document.getElementById('senha').focus();
        }

        function mostrarErro(msg) {
            var el = document.getElementById('erroMsg');
            el.textContent = msg;
            el.classList.add('show');
        }

        function entrarAdmin() {
            var senha = document.getElementById('senha').value;
            if (senha === '1111') {
                localStorage.setItem('sportmax_sessao', JSON.stringify({
                    tipo: 'admin',
                    nome: 'Administrador',
                    hora: new Date().toISOString()
                }));
                window.location.href = 'index.html';
            } else {
                mostrarErro('Senha incorreta! Apenas o dono pode acessar.');
                document.getElementById('senha').value = '';
                document.getElementById('senha').focus();
            }
        }

        function entrarComprador() {
            var user = null;
            try { user = JSON.parse(localStorage.getItem('sportmax_usuario') || 'null'); } catch(e) {}
            localStorage.setItem('sportmax_sessao', JSON.stringify({
                tipo: 'comprador',
                nome: user ? user.nome : 'Visitante',
                email: user ? user.email : null,
                hora: new Date().toISOString()
            }));
            window.location.href = 'index.html';
        }

        document.getElementById('senha').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') entrarAdmin();
        });
    </script>
</body>
</html>

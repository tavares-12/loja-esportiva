<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | SportMax</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .box {
    background: #fff;
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 400px;
  }
  h1 { text-align: center; color: #0ea5e9; margin-bottom: 8px; }
  p { text-align: center; color: #64748b; margin-bottom: 24px; }
  label { display: block; font-weight: bold; margin-bottom: 6px; color: #334155; }
  input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 16px;
    margin-bottom: 16px;
  }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #0ea5e9;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 10px;
  }
  button:hover { background: #0284c7; }
  .erro {
    background: #fee2e2;
    color: #b91c1c;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 16px;
    display: none;
  }
  .ok {
    background: #d1fae5;
    color: #065f46;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 16px;
    display: none;
  }
  .links { text-align: center; margin-top: 16px; }
  .links a { color: #0ea5e9; }
  #campoSenha { display: none; }
</style>
</head>
<body>
  <div class="box">
    <h1>SportMax</h1>
    <p>Escolha o tipo de acesso</p>

    <div class="erro" id="erro"></div>
    <div class="ok" id="ok"></div>

    <label>Tipo de acesso</label>
    <select id="tipo" onchange="mudarTipo()">
      <option value="">-- Selecione --</option>
      <option value="comprador">Comprador</option>
      <option value="admin">Administrador</option>
    </select>

    <div id="campoSenha">
      <label>Senha do Admin</label>
      <input type="password" id="senha" placeholder="Digite 1111" autocomplete="off">
      <small style="color:#64748b;display:block;margin-top:-12px;margin-bottom:16px;">Senha: 1111</small>
    </div>

    <button type="button" id="btnEntrar" onclick="entrar()">Entrar</button>
    <div class="links">
      <a href="cadastro.html">Criar conta de comprador</a>
    </div>
  </div>

<script>
(function() {
  try {
    var s = JSON.parse(localStorage.getItem('sportmax_sessao') || 'null');
    if (s && s.tipo) {
      window.location.href = 'index.html';
    }
  } catch (e) {}
})();

function mudarTipo() {
  var tipo = document.getElementById('tipo').value;
  document.getElementById('campoSenha').style.display = (tipo === 'admin') ? 'block' : 'none';
  document.getElementById('erro').style.display = 'none';
  document.getElementById('ok').style.display = 'none';
  if (tipo === 'admin') {
    document.getElementById('senha').focus();
  }
}

function mostrarErro(msg) {
  var el = document.getElementById('erro');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('ok').style.display = 'none';
}

function mostrarOk(msg) {
  var el = document.getElementById('ok');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('erro').style.display = 'none';
}

function entrar() {
  var tipo = document.getElementById('tipo').value;

  if (!tipo) {
    mostrarErro('Selecione Comprador ou Administrador.');
    return;
  }

  if (tipo === 'admin') {
    var senha = String(document.getElementById('senha').value || '').trim();
    if (senha !== '1111') {
      mostrarErro('Senha incorreta. Use: 1111');
      document.getElementById('senha').value = '';
      document.getElementById('senha').focus();
      return;
    }
    localStorage.setItem('sportmax_sessao', JSON.stringify({
      tipo: 'admin',
      nome: 'Administrador',
      hora: new Date().toISOString()
    }));
    mostrarOk('Acesso liberado! Entrando...');
    setTimeout(function() {
      window.location.href = 'index.html';
    }, 500);
    return;
  }

  var user = null;
  try { user = JSON.parse(localStorage.getItem('sportmax_usuario') || 'null'); } catch(e) {}
  localStorage.setItem('sportmax_sessao', JSON.stringify({
    tipo: 'comprador',
    nome: (user && user.nome) ? user.nome : 'Visitante',
    email: (user && user.email) ? user.email : null,
    hora: new Date().toISOString()
  }));
  mostrarOk('Bem-vindo! Entrando na loja...');
  setTimeout(function() {
    window.location.href = 'index.html';
  }, 500);
}

document.getElementById('senha').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') entrar();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendas | Loja Esportiva</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1><i class="fas fa-shopping-cart"></i> Vendas</h1>
            <p>Realize e acompanhe vendas</p>
        </div>
    </header>

    <nav>
        <a href="index.html"><i class="fas fa-home"></i> Início</a>
        <a href="produtos.html"><i class="fas fa-box"></i> Produtos</a>
        <a href="clientes.html"><i class="fas fa-users"></i> Clientes</a>
        <a href="vendas.html" class="active"><i class="fas fa-shopping-cart"></i> Vendas</a>
        <a href="relatorios.html"><i class="fas fa-chart-bar"></i> Relatórios</a>
    </nav>

    <main class="container">
        <!-- Nova Venda -->
        <div class="card">
            <h2><i class="fas fa-cash-register"></i> Nova Venda</h2>
            
            <div class="form-group">
                <label>Cliente</label>
                <select id="clienteVenda">
                    <option value="">Selecione um cliente</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label>Produto</label>
                    <select id="produtoVenda">
                        <option value="">Selecione um produto</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Quantidade</label>
                    <input type="number" id="qtdVenda" min="1" value="1">
                </div>
                <div class="form-group" style="display: flex; align-items: flex-end;">
                    <button class="btn btn-primary" onclick="adicionarItemVenda()">
                        <i class="fas fa-plus"></i> Adicionar
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table id="tabelaItensVenda">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Preço Unit.</th>
                            <th>Qtd</th>
                            <th>Subtotal</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="venda-total">
                <h3>Total: <span id="totalVenda">R$ 0,00</span></h3>
                <button class="btn btn-success btn-lg" onclick="finalizarVenda()">
                    <i class="fas fa-check"></i> Finalizar Venda
                </button>
            </div>
        </div>

        <!-- Histórico -->
        <div class="card">
            <h2><i class="fas fa-history"></i> Histórico de Vendas</h2>
            <div class="table-responsive">
                <table id="tabelaVendas">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Data</th>
                            <th>Cliente</th>
                            <th>Itens</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 SportMax Loja Esportiva</p>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            carregarDadosIniciais();
            carregarClientesSelect();
            carregarProdutosSelect();
            carregarHistoricoVendas();
            atualizarTabelaItens();
        });
    </script>
</body>
</html>
